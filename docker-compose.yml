services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: superprecios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superprecios}
      POSTGRES_DB: superprecios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superprecios"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://superprecios:${POSTGRES_PASSWORD:-superprecios}@db:5432/superprecios
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
